<script>



const preview=

document.getElementById(

"preview"

);



const playback=

document.getElementById(

"playback"

);



const overlay=

document.getElementById(

"overlay"

);



const ctx=

overlay.getContext(

"2d"

);



const detectCanvas=

document.getElementById(

"detectCanvas"

);



const detectCtx=

detectCanvas.getContext(

"2d",

{

willReadFrequently:true

}

);



const greenBox=

document.getElementById(

"greenBox"

);



const timerOverlay=

document.getElementById(

"timerOverlay"

);



const shotsOverlay=

document.getElementById(

"shotsOverlay"

);



const distanceOverlay=

document.getElementById(

"distanceOverlay"

);



const distancePopup=

document.getElementById(

"distancePopup"

);



const distanceOptions=

document.querySelectorAll(

".distanceOption"

);



const calibrateBtn=

document.getElementById(

"calibrateBtn"

);



const startBtn=

document.getElementById(

"startBtn"

);



const stopBtn=

document.getElementById(

"stopBtn"

);



const countdown=

document.getElementById(

"countdown"

);

//--------------------------
// VARIABLES (VERSION 4)
//--------------------------

let stream = null;
let mediaRecorder = null;
let recordedChunks = [];

let recordingSeconds = 0;
let timerInterval = null;

let targetDistance = 7;

let shots = 0;
let hits = [];

// Countdown shown on the overlay.
// null means no countdown is visible.
let countdownValue = null;

//-------------------------------------
// LASER STATE MACHINE (VERSION 7)
//-------------------------------------

const LASER_WAITING = 0;
const LASER_TRACKING = 1;

// Current detector state

let laserState = LASER_WAITING;

// Number of consecutive frames with
// no laser detected.

let laserMissingFrames = 0;

// Laser must disappear this many
// frames before another shot is allowed.

const LASER_RELEASE_FRAMES = 8;

// Prevent double-shots from timer
// glitches.

let lastShotTime = 0;


//-------------------------------------
// NORMALIZED TARGET
//-------------------------------------

// IMPORTANT:
//
// These values are stored from
// 0.0 to 1.0 instead of pixels.
//
// They never depend on camera
// resolution or browser size.
//
// Example:
//
// left = 0.22
//
// means:
//
// 22% across the image.
//

let target = {

    left:0,

    right:0,

    top:0,

    bottom:0,

    calibrated:false

};

// Used only during calibration

let calibrationStep = 0;

//-------------------------------------
// CURRENT CAMERA SIZE
//-------------------------------------

// Updated every resize()

let cameraWidth = 0;
let cameraHeight = 0;

//-------------------------------------
// DISPLAY SIZE
//-------------------------------------

// Size of displayed video element

let displayWidth = 0;
let displayHeight = 0;

//-------------------------------------
// OVERLAY SCALE
//-------------------------------------

// Converts camera coordinates
// to overlay coordinates.

let scaleX = 1;
let scaleY = 1;

//-------------------------------------
// DETECTOR SETTINGS (VERSION 5)
//-------------------------------------

const DETECTOR = {

    pixelStep:2,

    deltaThreshold:28,

    minBrightness:145,

    minBlobPixels:1,

    maxBlobPixels:80,

    shotDelay:250

};

//------------------------------------------------
// LOCAL COLOR DETECTOR (VERSION 9)
//------------------------------------------------

// Size of neighborhood around each pixel

const LOCAL_RADIUS = 1;

//------------------------------------------------
// ADAPTIVE TARGET GRID (VERSION 9)
//------------------------------------------------

// Divide the calibrated target into
// smaller regions.

// Each region will maintain its own
// average background brightness.

const GRID_COLS = 4;
const GRID_ROWS = 4;

// One brightness value per region.

let gridBrightness = [];

function resetGrid(){

    gridBrightness = [];

    for(let y=0; y<GRID_ROWS; y++){

        gridBrightness[y] = [];

        for(let x=0; x<GRID_COLS; x++){

            gridBrightness[y][x] = 0;

        }

    }

}

resetGrid();

//-------------------------------------
// BACKGROUND FRAME
//-------------------------------------

let backgroundFrame = null;

// Wait one frame before learning
// the background after recording starts.

let learnBackground = true;


//--------------------------
// CAMERA
//--------------------------

async function startCamera(){



try{



stream=

await navigator.mediaDevices

.getUserMedia({



video:{



facingMode:{

ideal:"environment"

},



width:{

ideal:1280

},



height:{

ideal:720

}



},



audio:true



});



preview.srcObject=

stream;



preview.onloadedmetadata=()=>{



resizeEverything();



};





}catch(err){



alert(

"Unable to access camera"

);



console.log(err);



}



}



startCamera();

preview.addEventListener(

"click",

handleCalibrationTap

);


//------------------------------------------------
// RESIZE EVERYTHING (VERSION 4)
//------------------------------------------------

function resizeEverything(){

    const video =
        preview.style.display != "none"
            ? preview
            : playback;

    if(
        !video.videoWidth ||
        !video.videoHeight
    ){
        return;
    }

    //----------------------------------------
    // Store camera size
    //----------------------------------------

    cameraWidth = video.videoWidth;
    cameraHeight = video.videoHeight;

    //----------------------------------------
    // Store displayed size
    //----------------------------------------

    const rect =
        video.getBoundingClientRect();

    displayWidth = rect.width;
    displayHeight = rect.height;

    //----------------------------------------
    // Overlay matches camera pixels
    //----------------------------------------

    overlay.width = cameraWidth;
    overlay.height = cameraHeight;

    //----------------------------------------
    // Conversion factors
    //----------------------------------------

    scaleX =
        overlay.width /
        cameraWidth;

    scaleY =
        overlay.height /
        cameraHeight;

    console.log(
        "Overlay:",
        overlay.width,
        overlay.height
    );

    drawGreenBox();

    drawHits();

}




//--------------------------
// COUNTDOWN
//--------------------------

function beginCountdown(){

    console.log("COUNTDOWN STARTED");

    let count = 3;

    countdownValue = count;

    drawCountdown();

    const interval = setInterval(()=>{

        console.log("COUNT:", count);

        count--;

        if(count > 0){

            countdownValue = count;

            drawCountdown();

        }else{

            clearInterval(interval);

            countdownValue = null;

            clearOverlay();

            drawHits();

            startRecording();

        }

    },1000);

}



//--------------------------
// START RECORDING
//--------------------------

function startRecording(){



recordedChunks=[];

hits=[];

shots=0;

recordingSeconds=0;

//-------------------------------------
// Reset detector state
//-------------------------------------

laserState = LASER_WAITING;

laserMissingFrames = 0;

backgroundFrame = null;

learnBackground = true;

lastShotTime = 0;





updateDisplays();





mediaRecorder=



new MediaRecorder(

stream

);





mediaRecorder

.ondataavailable=(e)=>{



if(

e.data.size>0

){



recordedChunks.push(

e.data

);



}



};





mediaRecorder

.onstop=



showPlayback;





mediaRecorder.start();

//-------------------------------------
// Give camera one frame to stabilize
//-------------------------------------

setTimeout(()=>{

    requestAnimationFrame(
        detectLaser
    );

},100);



timerInterval=



setInterval(()=>{


recordingSeconds++;


updateDisplays();



},1000);


    
startBtn.disabled=true;



stopBtn.disabled=false;



}




//--------------------------
// STOP RECORDING
//--------------------------

function stopRecording(){



mediaRecorder.stop();





clearInterval(

timerInterval

);





startBtn.disabled=false;



stopBtn.disabled=true;



}




//--------------------------
// PLAYBACK
//--------------------------

function showPlayback(){



const blob=



new Blob(



recordedChunks,



{

type:"video/webm"

}



);





const url=



URL.createObjectURL(

blob

);





preview.style.display=



"none";





playback.style.display=



"block";





playback.src=url;





playback.onloadedmetadata=()=>{



resizeEverything();





playback.play();





requestAnimationFrame(

syncPlayback

);



};



}


//--------------------------
// UPDATE DISPLAYS
//--------------------------

function updateDisplays(){

let mins=

Math.floor(

recordingSeconds/60

)

.toString()

.padStart(2,"0");



let secs=

(recordingSeconds%60)

.toString()

.padStart(2,"0");



let time=

`${mins}:${secs}`;



timerOverlay.innerHTML=

time;



shotsOverlay.innerHTML=

`Shots: ${shots}`;



distanceOverlay.innerHTML=

`Distance: ${targetDistance}y`;

}



//------------------------------------------------
// CALIBRATE TARGET (VERSION 4)
//------------------------------------------------

function calibrateTarget(){

    alert(
        "Tap the TOP LEFT corner of your target."
    );

    calibrationStep = 1;

}


function handleCalibrationTap(e){

    if(calibrationStep===0){
        return;
    }

    //--------------------------------------
    // Get displayed video size
    //--------------------------------------

    const rect = preview.getBoundingClientRect();

    //--------------------------------------
    // NORMALIZED coordinates (0-1)
    //--------------------------------------

    const nx =
        (e.clientX - rect.left) /
        rect.width;

    const ny =
        (e.clientY - rect.top) /
        rect.height;

    //--------------------------------------
    // FIRST TAP
    //--------------------------------------

    if(calibrationStep===1){

        target.left = nx;
        target.top = ny;

        calibrationStep = 2;

        alert(
            "Now tap the BOTTOM RIGHT corner."
        );

        return;

    }

    //--------------------------------------
    // SECOND TAP
    //--------------------------------------

    target.right = nx;
    target.bottom = ny;

    //--------------------------------------
    // Ensure correct ordering
    //--------------------------------------

    if(target.left > target.right){

        let t = target.left;
        target.left = target.right;
        target.right = t;

    }

    if(target.top > target.bottom){

        let t = target.top;
        target.top = target.bottom;
        target.bottom = t;

    }

target.calibrated = true;

calibrationStep = 0;

// Make absolutely sure the overlay
// matches the current camera size.
resizeEverything();

redrawOverlay();

console.log(
    "Normalized Target:",
    target
);

alert(
    "Target Calibrated"
);

}

//------------------------------------------------
// TARGET PIXELS
//------------------------------------------------

function getTargetPixels(){

    return{

        left:
            target.left *
            detectCanvas.width,

        right:
            target.right *
            detectCanvas.width,

        top:
            target.top *
            detectCanvas.height,

        bottom:
            target.bottom *
            detectCanvas.height

    };

}

//------------------------------------------------
// DRAW GREEN BOX (VERSION 5)
//------------------------------------------------

function drawGreenBox(){

    if(!target.calibrated){
        return;
    }

    const left =
        target.left * overlay.width;

    const top =
        target.top * overlay.height;

    const width =
        (target.right - target.left) *
        overlay.width;

    const height =
        (target.bottom - target.top) *
        overlay.height;

    ctx.save();

    ctx.strokeStyle = "#00FF00";
    ctx.lineWidth = 4;

    ctx.strokeRect(
        left,
        top,
        width,
        height
    );

    ctx.restore();

}

//------------------------------------------------
// CLEAR OVERLAY
//------------------------------------------------

function clearOverlay(){

    ctx.clearRect(
        0,
        0,
        overlay.width,
        overlay.height
    );

    if(target.calibrated){
        drawGreenBox();
    }

}

function drawCountdown(){

    clearOverlay();

    drawHits();

    if(countdownValue === null){
        return;
    }

    ctx.save();

    ctx.font = "bold 180px Arial";

    ctx.textAlign = "center";

    ctx.textBaseline = "middle";

    ctx.lineWidth = 8;

    ctx.strokeStyle = "black";

    ctx.strokeText(
        countdownValue,
        overlay.width / 2,
        overlay.height / 2
    );

    ctx.fillStyle = "#FFD400";

    ctx.fillText(
        countdownValue,
        overlay.width / 2,
        overlay.height / 2
    );

    ctx.restore();

}


//--------------------------
// DISTANCE POPUP
//--------------------------

distanceOverlay.onclick=(e)=>{



e.stopPropagation();



if(

distancePopup.style.display

=="block"

){

distancePopup.style.display=

"none";

}



else{



distancePopup.style.display=

"block";



}



};



distanceOptions.forEach(option=>{



option.onclick=(e)=>{



e.stopPropagation();



targetDistance=

parseInt(

option.innerText

);



distanceOptions

.forEach(o=>{



o.classList.remove(

"selected"

);



});



option.classList.add(

"selected"

);



distanceOverlay.innerHTML=

`Distance: ${targetDistance}y`;



distancePopup.style.display=

"none";



};



});



document.onclick=()=>{



distancePopup.style.display=

"none";



};


//------------------------------------------------
// LASER DETECTION (VERSION 4)
//------------------------------------------------

function detectLaser(){

    if(
        !mediaRecorder ||
        mediaRecorder.state !== "recording"
    ){
        return;
    }

    if(!target.calibrated){

        requestAnimationFrame(detectLaser);
        return;

    }

    //---------------------------------------
    // Copy current frame
    //---------------------------------------

    detectCtx.drawImage(

        preview,

        0,
        0,

        detectCanvas.width,
        detectCanvas.height

    );

    const frame = detectCtx.getImageData(

        0,
        0,

        detectCanvas.width,
        detectCanvas.height

    );

    const pixels = frame.data;

//---------------------------------------
// Learn background frame
//---------------------------------------

if(learnBackground){

    backgroundFrame = new Uint8ClampedArray(pixels);

    learnBackground = false;

    console.log("Background learned");

    requestAnimationFrame(detectLaser);

    return;

}

if(!backgroundFrame){

    requestAnimationFrame(detectLaser);

    return;

}

    //---------------------------------------
    // Current calibrated target
    //---------------------------------------

    const box = getTargetPixels();

    let totalWeight = 0;
    let totalX = 0;
    let totalY = 0;

    let brightPixels = 0;

    //------------------------------------------------
// Reset grid brightness sums
//------------------------------------------------

let gridTotal = [];
let gridCount = [];

for(let gy=0; gy<GRID_ROWS; gy++){

    gridTotal[gy] = [];
    gridCount[gy] = [];

    for(let gx=0; gx<GRID_COLS; gx++){

        gridTotal[gy][gx] = 0;
        gridCount[gy][gx] = 0;

    }

}

    //---------------------------------------
    // Scan target
    //---------------------------------------

    for(

        let y=Math.floor(box.top);

        y<Math.floor(box.bottom);

        y+=DETECTOR.pixelStep

    ){

const gridY = Math.max(

    0,

    Math.min(

        GRID_ROWS - 1,

        Math.floor(

            ((y - box.top) * GRID_ROWS) /

            (box.bottom - box.top)

        )

    )

);

        for(

            let x=Math.floor(box.left);

            x<Math.floor(box.right);

            x+=DETECTOR.pixelStep

        ){

            const i=

                (
                    y*detectCanvas.width+x
                )*4;

            const r=pixels[i];
            const g=pixels[i+1];
            const b=pixels[i+2];

            const brightness=

                (r+g+b)/3;

const gridX = Math.max(

    0,

    Math.min(

        GRID_COLS - 1,

        Math.floor(

            ((x - box.left) * GRID_COLS) /

            (box.right - box.left)

        )

    )

);

// Learn average brightness
gridTotal[gridY][gridX] += brightness;
gridCount[gridY][gridX]++;

//---------------------------------
// COLOR DIFFERENCE DETECTOR
//---------------------------------

const bgR = backgroundFrame[i];
const bgG = backgroundFrame[i+1];
const bgB = backgroundFrame[i+2];

// How much each channel increased
const redRise   = r - bgR;
const greenRise = g - bgG;
const blueRise  = b - bgB;

//------------------------------------------------
// Local lighting compensation
//------------------------------------------------

const localBrightness =

    gridBrightness[gridY]?.[gridX] ?? 150;

// Darker regions get a slightly lower threshold.
// Brighter regions get a slightly higher threshold.

let localThreshold = 28;

if(localBrightness > 190){

    localThreshold = 34;

}
else if(localBrightness > 170){

    localThreshold = 31;

}
else if(localBrightness < 120){

    localThreshold = 24;

}

// Detect a true red laser pulse
const laser =

    redRise > localThreshold &&

    redRise > (greenRise + 20) &&

    redRise > (blueRise + 20);

if(!laser){
    continue;
}


            

            brightPixels++;

 backgroundFrame[i] =
    (backgroundFrame[i] * 7 + r) / 8;

backgroundFrame[i+1] =
    (backgroundFrame[i+1] * 7 + g) / 8;

backgroundFrame[i+2] =
    (backgroundFrame[i+2] * 7 + b) / 8;

            const weight=

                Math.max(

                    brightness,

                    r

                );

            totalWeight+=weight;

            totalX+=x*weight;

            totalY+=y*weight;

        }

    }

//------------------------------------------------
// Update grid brightness map
//------------------------------------------------

for(let gy=0; gy<GRID_ROWS; gy++){

    for(let gx=0; gx<GRID_COLS; gx++){

        if(gridCount[gy][gx] > 0){

            const average =

                gridTotal[gy][gx] /

                gridCount[gy][gx];

            gridBrightness[gy][gx] =
                average;

        }

    }

}
    
//---------------------------------------
// NO LASER DETECTED
//---------------------------------------

if(

    brightPixels < DETECTOR.minBlobPixels ||

    brightPixels > DETECTOR.maxBlobPixels

){

    laserMissingFrames++;

    //------------------------------------
    // Return to WAITING only after the
    // laser has been gone several frames.
    //------------------------------------

    if(

        laserMissingFrames >=

        LASER_RELEASE_FRAMES

    ){

        laserState = LASER_WAITING;

        laserMissingFrames =

            LASER_RELEASE_FRAMES;

    }

    //------------------------------------
    // Keep previously recorded hits visible
    //------------------------------------

    redrawOverlay();

    requestAnimationFrame(

        detectLaser

    );

    return;

}
    
    //---------------------------------------
    // Find centre
    //---------------------------------------

    const hitX=

        totalX/

        totalWeight;

    const hitY=

        totalY/

        totalWeight;

//---------------------------------------
// Laser is currently being tracked
//---------------------------------------

laserMissingFrames = 0;

// Draw the live laser every frame

drawCurrentLaser(hitX, hitY);

//---------------------------------------
// VERSION 7 STATE MACHINE
//---------------------------------------

if(laserState === LASER_WAITING){

    laserState = LASER_TRACKING;

    laserMissingFrames = 0;

    const now = performance.now();

    if(now - lastShotTime >= DETECTOR.shotDelay){

        lastShotTime = now;

        shots++;

        hits.push({

            x: hitX / detectCanvas.width,

            y: hitY / detectCanvas.height,

            time: recordingSeconds

        });

        updateDisplays();

        console.log(

            "SHOT",

            shots,

            Math.round(hitX),

            Math.round(hitY)

        );

    }

}else{

    // Laser is already being tracked.
    // Do not record another shot.

    laserMissingFrames = 0;

}

    requestAnimationFrame(

        detectLaser

    );

}

//------------------------------------------------
// DRAW HITS (VERSION 7)
//------------------------------------------------

function drawHits(maxTime = Infinity){

    //----------------------------------------
    // Draw every saved hit up to maxTime
    //----------------------------------------

    for(const hit of hits){

        if(hit.time > maxTime){
            continue;
        }

        const drawX =
            hit.x * overlay.width;

        const drawY =
            hit.y * overlay.height;

        ctx.beginPath();

        ctx.arc(
            drawX,
            drawY,
            5,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "yellow";
        ctx.fill();

        ctx.lineWidth = 1;
        ctx.strokeStyle = "black";
        ctx.stroke();

    }

}

//------------------------------------------------
// REDRAW OVERLAY
//------------------------------------------------

function redrawOverlay(){

    clearOverlay();

    drawHits();

}

//------------------------------------------------
// DRAW CURRENT LASER (VERSION 6.2)
//------------------------------------------------

function drawCurrentLaser(hitX, hitY){

//----------------------------------------
// Redraw everything in the proper order
//----------------------------------------

redrawOverlay();

    //----------------------------------------
    // Convert detector coordinates
    // to overlay coordinates
    //----------------------------------------

    const drawX =
        (hitX / detectCanvas.width) *
        overlay.width;

    const drawY =
        (hitY / detectCanvas.height) *
        overlay.height;

    //----------------------------------------
    // Draw the live laser
    //----------------------------------------

    ctx.beginPath();

    ctx.arc(
        drawX,
        drawY,
        8,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle = "red";
    ctx.lineWidth = 3;
    ctx.stroke();

}


calibrateBtn.onclick=()=>{

calibrateTarget();

};



function syncPlayback(){

if(

playback.paused ||

playback.ended

){

return;

}



redrawOverlay();



drawHits(playback.currentTime);



let t=

Math.floor(

playback.currentTime

);



let mins=

Math.floor(
