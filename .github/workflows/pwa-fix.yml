name: Fix PWA script load order

on:
  push:
    branches:
      - pwa-conversion
    paths:
      - '.github/workflows/pwa-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: pwa-conversion
          fetch-depth: 0

      - name: Fix script loading and manifest icon purpose
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()
          old = '<script src="app.js"></script>'
          new = '<script src="app.js" defer></script>'
          if old not in text:
              raise SystemExit('Expected app.js script tag was not found')
          text = text.replace(old, new, 1)
          index.write_text(text)

          manifest = Path('manifest.json')
          text = manifest.read_text()
          text = text.replace('"purpose": "any maskable"', '"purpose": "any"')
          manifest.write_text(text)
          PY

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "Fix PWA script load order and icon purpose"
          git push origin pwa-conversion
