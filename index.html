function resizeEverything(){

    const video =
        preview.style.display != "none"
            ? preview
            : playback;

    if(
        !video.videoWidth ||
        !video.videoHeight
    ){
        return;
    }

    //----------------------------------------
    // Store camera size
    //----------------------------------------

    cameraWidth = video.videoWidth;
    cameraHeight = video.videoHeight;

    //----------------------------------------
    // Store displayed size
    //----------------------------------------

    const rect =
        video.getBoundingClientRect();

    displayWidth = rect.width;
    displayHeight = rect.height;

    //----------------------------------------
    // Overlay matches camera pixels
    //----------------------------------------

    overlay.width = cameraWidth;
    overlay.height = cameraHeight;

    //----------------------------------------

//------------------------------------------------
// BEGIN CALIBRATION DRAG
//------------------------------------------------

function beginCalibrationDrag(e){

    if(calibrationStep !== 1){
        return;
    }

const rect = overlay.getBoundingClientRect();
    
    calibrationDragging = true;

    calibrationStartX =
        (e.clientX - rect.left) / rect.width;

    calibrationStartY =
        (e.clientY - rect.top) / rect.height;

    calibrationCurrentX = calibrationStartX;
    calibrationCurrentY = calibrationStartY;

    target.calibrated = false;
}

//------------------------------------------------
// UPDATE CALIBRATION DRAG
//------------------------------------------------

function updateCalibrationDrag(e){

    if(!calibrationDragging){
        return;
    }

const rect = overlay.getBoundingClientRect();
    
    calibrationCurrentX =
        (e.clientX - rect.left) / rect.width;

    calibrationCurrentY =
        (e.clientY - rect.top) / rect.height;

    target.left =
        Math.min(calibrationStartX, calibrationCurrentX);

    target.right =
        Math.max(calibrationStartX, calibrationCurrentX);

    target.top =
        Math.min(calibrationStartY, calibrationCurrentY);

    target.bottom =
        Math.max(calibrationStartY, calibrationCurrentY);

    redrawOverlay();

}



//------------------------------------------------
// START DRAG CALIBRATION
//------------------------------------------------

function calibrateTarget(){

    alert("DRAW TARGET\n\nTouch and drag to draw a box around your target.");

    calibrationStep = 1;
}

//------------------------------------------------
// COMPLETE DRAG CALIBRATION
//------------------------------------------------

function finishCalibrationDrag(e){

    if(!calibrationDragging){
        return;
    }

    calibrationDragging = false;

    if(calibrationStep===0){
        return;
    }

const rect = overlay.getBoundingClientRect();
    
    calibrationCurrentX =
        (e.clientX - rect.left) / rect.width;

    calibrationCurrentY =
        (e.clientY - rect.top) / rect.height;

    target.left =
        Math.min(calibrationStartX, calibrationCurrentX);

    target.right =
        Math.max(calibrationStartX, calibrationCurrentX);

    target.top =
        Math.min(calibrationStartY, calibrationCurrentY);

    target.bottom =
        Math.max(calibrationStartY, calibrationCurrentY);

    target.calibrated = true;

    calibrationStep = 0;

    resizeEverything();

    redrawOverlay();

    console.log("Normalized Target:", target);

    alert("Calibration Complete");
}

//------------------------------------------------

//------------------------------------------------

function drawGreenBox(){

    if(!target.calibrated && !calibrationDragging){
        return;
    }

    const left =
        target.left * overlay.width;

    const top =
        target.top * overlay.height;

    const width =
        (target.right - target.left) *
        overlay.width;

    const height =
        (target.bottom - target.top) *
        overlay.height;

    ctx.save();

    ctx.strokeStyle = "#00FF00";
    ctx.lineWidth = 4;

    //----------------------------------------
    // Rectangle
    //----------------------------------------

    if(targetShape === "rectangle"){

        ctx.strokeRect(
            left,
            top,
            width,
            height
        );

    }

    //----------------------------------------
    // Oval
    //----------------------------------------

    else{

        ctx.beginPath();

        ctx.ellipse(

            left + width / 2,

            top + height / 2,

            width / 2,

            height / 2,

            0,

            0,

            Math.PI * 2

        );

        ctx.stroke();

    }

    ctx.restore();

}

 if(target.calibrated && !calibrationDragging){

}

}

function drawCountdown(){

    clearOverlay();

    drawHits();

    if(countdownValue === null){
        return;
    }

    ctx.save();

    ctx.font = "bold 180px Arial";

    ctx.textAlign = "center";

    ctx.textBaseline = "middle";

    ctx.lineWidth = 8;

    ctx.strokeStyle = "black";

    ctx.strokeText(
        countdownValue,
        overlay.width / 2,
        overlay.height / 2
    );

    ctx.fillStyle = "#FFD400";

    ctx.fillText(
        countdownValue,
        overlay.width / 2,
        overlay.height / 2
    );

    ctx.restore();

}



//------------------------------------------------
// LASER DETECTION (VERSION 4)
//------------------------------------------------

function detectLaser(){

    if(
        !mediaRecorder ||
        mediaRecorder.state !== "recording"
    ){
        return;
    }

    if(!target.calibrated){

        requestAnimationFrame(detectLaser);
        return;

    }

    //---------------------------------------
    // Copy current frame
    //---------------------------------------

    detectCtx.drawImage(

        preview,

        0,
        0,

        detectCanvas.width,
        detectCanvas.height

    );

    const frame = detectCtx.getImageData(

        0,
        0,

        detectCanvas.width,
        detectCanvas.height

    );

    const pixels = frame.data;

//---------------------------------------
// Learn background frame
//---------------------------------------

if(learnBackground){

    backgroundFrame = new Uint8ClampedArray(pixels);

    learnBackground = false;

    console.log("Background learned");

    requestAnimationFrame(detectLaser);

    return;

}

if(!backgroundFrame){

    requestAnimationFrame(detectLaser);

    return;

}

    //---------------------------------------
    // Current calibrated target
    //---------------------------------------

    const box = getTargetPixels();

    let totalWeight = 0;
    let totalX = 0;
    let totalY = 0;

    let brightPixels = 0;

    //------------------------------------------------
// Reset grid brightness sums
//------------------------------------------------

let gridTotal = [];
let gridCount = [];

for(let gy=0; gy<GRID_ROWS; gy++){

    gridTotal[gy] = [];
    gridCount[gy] = [];

    for(let gx=0; gx<GRID_COLS; gx++){

        gridTotal[gy][gx] = 0;
        gridCount[gy][gx] = 0;

    }

}

    //---------------------------------------
    // Scan target
    //---------------------------------------

    for(

        let y=Math.floor(box.top);

        y<Math.floor(box.bottom);

        y+=DETECTOR.pixelStep

    ){

const gridY = Math.max(

    0,

    Math.min(

        GRID_ROWS - 1,

        Math.floor(

            ((y - box.top) * GRID_ROWS) /

            (box.bottom - box.top)

        )

    )

);

        for(

            let x=Math.floor(box.left);

            x<Math.floor(box.right);

            x+=DETECTOR.pixelStep

        ){

//------------------------------------------------
// Skip pixels outside oval target
//------------------------------------------------

if(targetShape === "oval"){

    const centerX =
        (box.left + box.right) / 2;

    const centerY =
        (box.top + box.bottom) / 2;

    const radiusX =
        (box.right - box.left) / 2;

    const radiusY =
        (box.bottom - box.top) / 2;

    const dx =
        (x - centerX) / radiusX;

    const dy =
        (y - centerY) / radiusY;

    if((dx * dx + dy * dy) > 1){

        continue;

    }

}
            
            const i=

                (
                    y*detectCanvas.width+x
                )*4;

            const r=pixels[i];
            const g=pixels[i+1];
            const b=pixels[i+2];

            const brightness=

                (r+g+b)/3;

const gridX = Math.max(

    0,

    Math.min(

        GRID_COLS - 1,

        Math.floor(

            ((x - box.left) * GRID_COLS) /

            (box.right - box.left)

        )

    )

);

// Learn average brightness
gridTotal[gridY][gridX] += brightness;
gridCount[gridY][gridX]++;

//---------------------------------
// COLOR DIFFERENCE DETECTOR
//---------------------------------

const bgR = backgroundFrame[i];
const bgG = backgroundFrame[i+1];
const bgB = backgroundFrame[i+2];

// How much each channel increased
const redRise   = r - bgR;
const greenRise = g - bgG;
const blueRise  = b - bgB;

//------------------------------------------------
// Local lighting compensation
//------------------------------------------------

const localBrightness =

    gridBrightness[gridY]?.[gridX] ?? 150;

// Darker regions get a slightly lower threshold.
// Brighter regions get a slightly higher threshold.

let localThreshold = DETECTOR.baseThreshold;

if(localBrightness > 190){

    localThreshold = DETECTOR.baseThreshold + 6;

}
else if(localBrightness > 170){

    localThreshold = DETECTOR.baseThreshold + 3;

}
else if(localBrightness < 120){

    localThreshold = DETECTOR.baseThreshold - 4;

}

// Detect a true red laser pulse
const laser =

    redRise > localThreshold &&

    redRise > (greenRise + DETECTOR.colorDifference) &&

    redRise > (blueRise + DETECTOR.colorDifference);

if(!laser){
    continue;
}


            

            brightPixels++;

if(!freezeBackground){

    backgroundFrame[i] =
        (backgroundFrame[i] * 7 + r) / 8;

    backgroundFrame[i+1] =
        (backgroundFrame[i+1] * 7 + g) / 8;

    backgroundFrame[i+2] =
        (backgroundFrame[i+2] * 7 + b) / 8;

}

            const weight=

                Math.max(

                    brightness,

                    r

                );

            totalWeight+=weight;

            totalX+=x*weight;

            totalY+=y*weight;

        }

    }

//------------------------------------------------
// Update grid brightness map
//------------------------------------------------

for(let gy=0; gy<GRID_ROWS; gy++){

    for(let gx=0; gx<GRID_COLS; gx++){

        if(gridCount[gy][gx] > 0){

            const average =

                gridTotal[gy][gx] /

                gridCount[gy][gx];

            gridBrightness[gy][gx] =
                average;

        }

    }

}
    
//---------------------------------------
// NO LASER DETECTED
//---------------------------------------

if(

    brightPixels < DETECTOR.minBlobPixels ||

    brightPixels > DETECTOR.maxBlobPixels

){

    laserMissingFrames++;

    //------------------------------------
    // Return to WAITING only after the
    // laser has been gone several frames.
    //------------------------------------

if(

    laserMissingFrames >=

    LASER_RELEASE_FRAMES

){

    laserState = LASER_WAITING;

    freezeBackground = false;

    laserMissingFrames =

        LASER_RELEASE_FRAMES;

}

    

    //------------------------------------
    // Keep previously recorded hits visible
    //------------------------------------

currentLaserVisible = false;
    
    redrawOverlay();

    requestAnimationFrame(

        detectLaser

    );

    return;

}
    
    //---------------------------------------
    // Find centre
    //---------------------------------------

    const hitX=

        totalX/

        totalWeight;

    const hitY=

        totalY/

        totalWeight;

//---------------------------------------
// Laser is currently being tracked
//---------------------------------------

laserMissingFrames = 0;

// Draw the live laser every frame

drawCurrentLaser(hitX, hitY);

//---------------------------------------
// VERSION 7 STATE MACHINE
//---------------------------------------

if(laserState === LASER_WAITING){

    laserState = LASER_TRACKING;

    freezeBackground = true;

    laserMissingFrames = 0;

    const now = performance.now();

    if(now - lastShotTime >= DETECTOR.shotDelay){

        lastShotTime = now;

        shots++;

        hits.push({

            x: hitX / detectCanvas.width,

            y: hitY / detectCanvas.height,

            time: (performance.now() - recordingStartTime) / 1000

        });

        updateDisplays();

        console.log(

            "SHOT",

            shots,

            Math.round(hitX),

            Math.round(hitY)

        );

    }

}else{

    // Laser is already being tracked.
    // Do not record another shot.

    laserMissingFrames = 0;

}

    requestAnimationFrame(

        detectLaser

    );

}

//------------------------------------------------
// DRAW HITS (VERSION 7)
//------------------------------------------------

function drawHits(maxTime = Infinity){

    //----------------------------------------
    // Draw every saved hit up to maxTime
    //----------------------------------------

    for(const hit of hits){

        if(hit.time > maxTime){
            continue;
        }

        const drawX =
            hit.x * overlay.width;

        const drawY =
            hit.y * overlay.height;

        ctx.beginPath();

        ctx.arc(
            drawX,
            drawY,
            5,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "yellow";
        ctx.fill();

        ctx.lineWidth = 1;
        ctx.strokeStyle = "black";
        ctx.stroke();

    }

}


//------------------------------------------------
// CALCULATE GROUP CENTER
//------------------------------------------------

function calculateGroupCenter(){

    //----------------------------------------
    // No shots recorded
    //----------------------------------------

    if(hits.length === 0){

        return null;

    }

    //----------------------------------------
    // Add all shot locations
    //----------------------------------------

    let totalX = 0;
    let totalY = 0;

    for(const hit of hits){

        totalX += hit.x;
        totalY += hit.y;

    }

    //----------------------------------------
    // Return average location
    //----------------------------------------

    return{

        x: totalX / hits.length,

        y: totalY / hits.length

    };

}
    
    

//------------------------------------------------
// REDRAW OVERLAY (VERSION 2)
//------------------------------------------------

function redrawOverlay({

    maxTime = Infinity

} = {}){

    //----------------------------------------
    // Clear everything
    //----------------------------------------

    clearOverlay();

//----------------------------------------
// Draw target while dragging
//----------------------------------------

if(calibrationDragging){

    drawGreenBox();

}
    

//------------------------------------------------
// Draw drag calibration rectangle
//------------------------------------------------

if(calibrationDragging){

    ctx.save();

    ctx.strokeStyle = "#00FF00";
    ctx.lineWidth = 4;

    ctx.strokeRect(

        target.left * overlay.width,

        target.top * overlay.height,

        (target.right - target.left) * overlay.width,

        (target.bottom - target.top) * overlay.height

    );

    ctx.restore();

}
    

//----------------------------------------
// Draw recorded hits
//----------------------------------------

drawHits(maxTime);

    //----------------------------------------
    // Draw countdown if active
    //----------------------------------------

    if(countdownValue !== null){

        ctx.save();

        ctx.font = "bold 180px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.lineWidth = 8;
        ctx.strokeStyle = "black";

        ctx.strokeText(
            countdownValue,
            overlay.width / 2,
            overlay.height / 2
        );

        ctx.fillStyle = "#FFD400";

        ctx.fillText(
            countdownValue,
            overlay.width / 2,
            overlay.height / 2
        );

        ctx.restore();

    }

//----------------------------------------
// Draw current laser
//----------------------------------------

if(currentLaserVisible){

    ctx.beginPath();

    ctx.arc(
        currentLaserX,
        currentLaserY,
        8,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle = "red";
    ctx.lineWidth = 3;
    ctx.stroke();

}

//----------------------------------------
// Draw group center
//----------------------------------------

if(
    analysisEnabled &&
    groupCenter &&
    playback.style.display != "none"
){
    const centerX =
        groupCenter.x * overlay.width;

    const centerY =
        groupCenter.y * overlay.height;

    ctx.strokeStyle = "red";
    ctx.lineWidth = 2;

 //----------------------------------------
// Horizontal line
//----------------------------------------

ctx.beginPath();

ctx.moveTo(centerX - 24, centerY);

ctx.lineTo(centerX + 24, centerY);

ctx.stroke();

//----------------------------------------
// Vertical line
//----------------------------------------

ctx.beginPath();

ctx.moveTo(centerX, centerY - 24);

ctx.lineTo(centerX, centerY + 24);

ctx.stroke();

    
    //----------------------------------------
    // White center dot
    //----------------------------------------

    ctx.beginPath();

    ctx.arc(
        centerX,
        centerY,
        6,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "white";

    ctx.fill();

    ctx.stroke();

}
    

}

//------------------------------------------------
// DRAW CURRENT LASER (VERSION 7)
//------------------------------------------------

//------------------------------------------------
// UPDATE CURRENT LASER
//------------------------------------------------

function drawCurrentLaser(hitX, hitY){

    //----------------------------------------
    // Convert detector coordinates
    //----------------------------------------

    currentLaserX =
        (hitX / detectCanvas.width) *
        overlay.width;

    currentLaserY =
        (hitY / detectCanvas.height) *
        overlay.height;

    //----------------------------------------
    // Laser is now visible
    //----------------------------------------

    currentLaserVisible = true;

}


calibrateBtn.onclick=()=>{

settingsPanel.style.display = "none"; 

clearOverlayData();    

calibrateTarget();

};

//------------------------------------------------
// LIVE OVERLAY LOOP
//------------------------------------------------

function liveOverlayLoop(){

    // Only run while viewing the live camera
    if(preview.style.display != "none"){

        redrawOverlay();

    }

    requestAnimationFrame(liveOverlayLoop);

}



function syncPlayback(){

if(

playback.paused ||

playback.ended

){

return;

}

redrawOverlay({

    maxTime: playback.currentTime

});



let t=

Math.floor(

playback.currentTime

);



let mins=

Math.floor(

t/60

)

.toString()

.padStart(

2,

"0"

);



let secs=

(t%60)

.toString()

.padStart(

2,

"0"

);



timerOverlay.innerHTML=

`${mins}:${secs}`;



shotsOverlay.innerHTML=

`Shots: ${hits.length}`;



requestAnimationFrame(

syncPlayback

);

}



startBtn.onclick = ()=>{

    // If we're currently counting down, cancel it.
    if(countdownRunning){

        clearInterval(countdownInterval);
        countdownInterval = null;
        countdownRunning = false;

        countdownValue = null;
        clearOverlay();
        drawHits();

startBtn.innerHTML = "&#9654; Start Recording";
startBtn.style.background = "#2e7d32";
startBtn.style.color = "white";


// Restore setup buttons
setupControls.hidden = false;

console.log("COUNTDOWN CANCELLED - BUTTONS RESTORED");

return;
    }

    // If already recording, stop recording.
    if(
        mediaRecorder &&
        mediaRecorder.state === "recording"
    ){

        stopRecording();

        return;

    }

    console.log("START BUTTON CLICKED");

    // Immediately switch button to STOP state
  startBtn.innerHTML = "&#9632; Stop Recording";
    startBtn.style.background = "#d32f2f";
    startBtn.style.color = "white";


     clearOverlayData();

    playback.pause();

    playback.src = "";

    preview.style.display = "block";

    playback.style.display = "none";

    
    setupControls.hidden = true;

    beginCountdown();

};
    

analysisBtn.onchange=()=>{

    analysisEnabled =
        analysisBtn.checked;

};

sensitivitySelect.onchange = ()=>{

    laserSensitivity = sensitivitySelect.value;

    switch(laserSensitivity){

        case "normal":

            DETECTOR.baseThreshold = 30;
            DETECTOR.colorDifference = 22;

            break;

        case "medium":

            DETECTOR.baseThreshold = 22;
            DETECTOR.colorDifference = 16;

            break;

        case "high":

            DETECTOR.baseThreshold = 12;
            DETECTOR.colorDifference = 8;

            break;

    }

    console.log(
        "Laser Sensitivity:",
        laserSensitivity,
        "Base Threshold:",
        DETECTOR.baseThreshold,
        "Color Difference:",
        DETECTOR.colorDifference
    );

};
    

targetShapeSelect.onchange = ()=>{

    targetShape =
        targetShapeSelect.value;

    redrawOverlay();

};

countdownSelect.onchange = ()=>{

    countdownSeconds =
        Number(countdownSelect.value);

};
    

distanceSelect.onchange = ()=>{

    targetDistance =
        Number(distanceSelect.value);

};
    


    
    

settingsBtn.onclick=()=>{

    if(settingsPanel.style.display=="block"){

        settingsPanel.style.display="none";

    }

    else{

        settingsPanel.style.display="block";

    }

};
