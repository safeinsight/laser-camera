//------------------------------------------------
// RESIZE EVERYTHING -->
//------------------------------------------------

function resizeEverything(){


    
    const video =
        preview.style.display != "none"
            ? preview
            : playback;


    if(
        !video.videoWidth ||
        !video.videoHeight
    ){
        return;
    }


    cameraWidth =
        video.videoWidth;

    cameraHeight =
        video.videoHeight;


    const rect =
        video.getBoundingClientRect();

    const containerRect =
    video.parentElement.getBoundingClientRect();


overlay.style.left =
    (rect.left - containerRect.left) + "px";

overlay.style.top =
    (rect.top - containerRect.top) + "px";

overlay.style.width =
    rect.width + "px";

overlay.style.height =
    rect.height + "px";

const overlayRect =
    overlay.getBoundingClientRect();

    displayWidth =
        rect.width;

    displayHeight =
        rect.height;

    //----------------------------------------
    // Calculate actual displayed camera image
    // inside object-fit:contain video
    //----------------------------------------

const videoRatio =
    cameraWidth / cameraHeight;

const elementRatio =
    rect.width / rect.height;


let displayedWidth;
let displayedHeight;


if(elementRatio > videoRatio){

    // black bars left/right

    displayedHeight =
        rect.height;

    displayedWidth =
        displayedHeight * videoRatio;

}
else{

    // black bars top/bottom

    displayedWidth =
        rect.width;

    displayedHeight =
        displayedWidth / videoRatio;

}


videoOffsetX =
    (rect.width - displayedWidth) / 2;

videoOffsetY =
    (rect.height - displayedHeight) / 2;


videoScaleX =
    cameraWidth / displayedWidth;

videoScaleY =
    cameraHeight / displayedHeight;


    //----------------------------------------
    // Match canvas to video display ratio
    //----------------------------------------

//----------------------------------------
// Overlay matches camera pixels
//----------------------------------------

overlay.width =
    cameraWidth;

overlay.height =
    cameraHeight;


//----------------------------------------
// Detection canvas matches camera pixels
//----------------------------------------

//----------------------------------------
// Detection canvas uses reduced resolution
//----------------------------------------

detectCanvas.width = 640;
detectCanvas.height = 360;



    //----------------------------------------
    // Resize CSS canvas exactly to video
    //----------------------------------------

    redrawOverlay();
}

//------------------------------------------------

//------------------------------------------------

function beginCalibrationDrag(e){

    if(calibrationStep !== 1){
        return;
    }
const rect = overlay.getBoundingClientRect();
    calibrationDragging = true;
    calibrationStartX =
        (e.clientX - rect.left) / rect.width;
    calibrationStartY =
        (e.clientY - rect.top) / rect.height;
    calibrationCurrentX = calibrationStartX;
    calibrationCurrentY = calibrationStartY;
    currentTarget.calibrated = false;
}

//------------------------------------------------
// UPDATE CALIBRATION DRAG -->
//------------------------------------------------

function updateCalibrationDrag(e){

    if(!calibrationDragging){
        return;
    }
const rect = overlay.getBoundingClientRect();

    currentTarget.top =
        Math.min(calibrationStartY, calibrationCurrentY);
    currentTarget.bottom =
        Math.max(calibrationStartY, calibrationCurrentY);

}

function nextTarget(){

    //----------------------------------------
    // Build a list of usable targets
    //----------------------------------------

    const availableTargets =

        targets.filter(

            target => target.calibrated

        );

    if(availableTargets.length === 0){

        return;

    }

    //----------------------------------------
    // Only one target
    //----------------------------------------

    if(availableTargets.length === 1){

        activeTarget = availableTargets[0];

        redrawOverlay();

        return;

    }

    //----------------------------------------
    // Pick a different target
    //----------------------------------------

    let newTarget;

    do{

        const randomIndex = Math.floor(

            Math.random() *

            availableTargets.length

        );

        newTarget =

            availableTargets[randomIndex];

    }

    while(newTarget === activeTarget);

    //----------------------------------------
    // Activate it
    //----------------------------------------

    activeTarget = newTarget;

//----------------------------------------
// Save target change for playback
//----------------------------------------

targetHistory.push({

    id: activeTarget.id,

    time:
        (performance.now() - recordingStartTime) / 1000

});

redrawOverlay();

}

//------------------------------------------------
// GET ACTIVE TARGET FOR PLAYBACK
//------------------------------------------------

function getPlaybackActiveTarget(playbackTime){

    //----------------------------------------
    // Default to current active target
    //----------------------------------------

    let targetId = null;

    //----------------------------------------
    // Find latest target change
    //----------------------------------------

    for(const event of targetHistory){

        if(event.time <= playbackTime){

            targetId = event.id;

        }else{

            break;

        }

    }

    //----------------------------------------
    // Find matching target object
    //----------------------------------------

    if(targetId === null){
        return null;
    }

    return targets.find(

        target => target.id === targetId

    );

}

//------------------------------------------------
// SCAN ONE TARGET -->
//------------------------------------------------

function scanTarget(target, pixels){

    const box = getTargetPixels(target);

    let totalWeight = 0;
    let totalX = 0;
    let totalY = 0;

    let brightPixels = 0;

    //------------------------------------------------
    // Reset grid brightness sums
    //------------------------------------------------

    let gridTotal = [];
    let gridCount = [];

    for(let gy=0; gy<GRID_ROWS; gy++){

        gridTotal[gy] = [];
        gridCount[gy] = [];

        for(let gx=0; gx<GRID_COLS; gx++){

            gridTotal[gy][gx] = 0;
            gridCount[gy][gx] = 0;

        }

    }

    //------------------------------------------------
    // Scan target
    //------------------------------------------------

    for(

        let y = Math.floor(box.top);

        y < Math.floor(box.bottom);

        y += DETECTOR.pixelStep

    ){

        const gridY = Math.max(

            0,

            Math.min(

                GRID_ROWS - 1,

                Math.floor(

                    ((y - box.top) * GRID_ROWS) /

                    (box.bottom - box.top)

                )

            )

        );

        for(

            let x = Math.floor(box.left);

            x < Math.floor(box.right);

            x += DETECTOR.pixelStep

        ){

            //----------------------------------------
            // Ignore pixels outside an oval target
            //----------------------------------------

            if(target.shape === "oval"){

                const centerX =
                    (box.left + box.right) / 2;

                const centerY =
                    (box.top + box.bottom) / 2;

                const radiusX =
                    (box.right - box.left) / 2;

                const radiusY =
                    (box.bottom - box.top) / 2;

                const dx =
                    (x - centerX) / radiusX;

                const dy =
                    (y - centerY) / radiusY;

                if((dx * dx + dy * dy) > 1){

                    continue;

                }

            }

            const i =

                (y * detectCanvas.width + x) * 4;

            const r = pixels[i];
            const g = pixels[i+1];
            const b = pixels[i+2];

            const brightness =

                (r + g + b) / 3;

            const gridX = Math.max(

                0,

                Math.min(

                    GRID_COLS - 1,

                    Math.floor(

                        ((x - box.left) * GRID_COLS) /

                        (box.right - box.left)

                    )

                )

            );

            gridTotal[gridY][gridX] += brightness;
            gridCount[gridY][gridX]++;

            const bgR = backgroundFrame[i];
            const bgG = backgroundFrame[i+1];
            const bgB = backgroundFrame[i+2];

            const redRise   = r - bgR;
            const greenRise = g - bgG;
            const blueRise  = b - bgB;

            const localBrightness =

                gridBrightness[gridY]?.[gridX] ?? 150;

            let localThreshold = DETECTOR.baseThreshold;

            if(localBrightness > 190){

                localThreshold += 6;

            }else if(localBrightness > 170){

                localThreshold += 3;

            }else if(localBrightness < 120){

                localThreshold -= 4;

            }

            const laser =

                redRise > localThreshold &&

                redRise >

                (greenRise + DETECTOR.colorDifference) &&

                redRise >

                (blueRise + DETECTOR.colorDifference);

            if(!laser){
                continue;
            }

            brightPixels++;

            const weight =

                Math.max(

                    brightness,

                    r

                );

            totalWeight += weight;

            totalX += x * weight;

            totalY += y * weight;

        }

    }

    //------------------------------------------------
    // Return scan results
    //------------------------------------------------

    return{

        brightPixels,

        totalWeight,

        totalX,

        totalY,

        gridTotal,

        gridCount

    };

}

//------------------------------------------------
// LASER DETECTION -->
//------------------------------------------------

function detectLaser(){

    if(
        !mediaRecorder ||
        mediaRecorder.state !== "recording"
    ){
        return;
    }

//------------------------------------------------
// Make sure at least one target exists
//------------------------------------------------

const hasTarget = targets.some(
    target => target.calibrated
);

if(!hasTarget){
    requestAnimationFrame(detectLaser);
    return;
}

    //---------------------------------------
    // Copy current frame
    //---------------------------------------

    detectCtx.drawImage(
        preview,
        0,
        0,
        detectCanvas.width,
        detectCanvas.height
    );

    const frame = detectCtx.getImageData(
        0,
        0,
        detectCanvas.width,
        detectCanvas.height
    );

    const pixels = frame.data;

    //---------------------------------------
    // Learn background frame
    //---------------------------------------

if(learnBackground){
    backgroundFrame = new Uint8ClampedArray(pixels);
    learnBackground = false;
    console.log("Background learned");
    requestAnimationFrame(detectLaser);
    return;
}

if(!backgroundFrame){
    requestAnimationFrame(detectLaser);
    return;
}

//------------------------------------------------
// Scan active target only
//------------------------------------------------

let result = null;
let hitTarget = null;

if(
    activeTarget &&
    activeTarget.calibrated
){
    result = scanTarget(
        activeTarget,
        pixels
    );

    //----------------------------------------
    // Laser found in active target
    //----------------------------------------

    if(
        result.brightPixels >= DETECTOR.minBlobPixels &&
        result.brightPixels <= DETECTOR.maxBlobPixels
    ){
        hitTarget = activeTarget;
    }
}
    
if(hitTarget){

    console.log(

        "Hit Target:",

        hitTarget.id

    );

    //----------------------------------------
    // Advance to the next target
    //----------------------------------------

    //----------------------------------------
    // Wait before calling next target
    //----------------------------------------

//----------------------------------------
// Schedule next target only once
//----------------------------------------

if(!waitingForNextTarget){

    waitingForNextTarget = true;

    setTimeout(

        ()=>{

            nextTarget();

            waitingForNextTarget = false;

        },

        250

    );

}

}

//------------------------------------------------
// Copy scan results
//------------------------------------------------

let brightPixels =
    result?.brightPixels ?? 0;
let totalWeight =
    result?.totalWeight ?? 0;
let totalX =
    result?.totalX ?? 0;
let totalY =
    result?.totalY ?? 0;
let gridTotal =
    result?.gridTotal ?? [];
let gridCount =
    result?.gridCount ?? [];

    //------------------------------------------------
    // Update grid brightness map
    //------------------------------------------------

for(let gy=0; gy<GRID_ROWS; gy++){

    for(let gx=0; gx<GRID_COLS; gx++){
        if(gridCount[gy][gx] > 0){
            const average =
                gridTotal[gy][gx] /
                gridCount[gy][gx];
            gridBrightness[gy][gx] =
                average;
        }
    }
}
    
    //---------------------------------------
    // No Laser Detected
    //---------------------------------------

if(
    brightPixels < DETECTOR.minBlobPixels ||
    brightPixels > DETECTOR.maxBlobPixels
){
    laserMissingFrames++;

    //------------------------------------
    // Return to WAITING only after the
    // laser has been gone several frames.
    //------------------------------------

if(
    laserMissingFrames >=
    LASER_RELEASE_FRAMES
){

    laserState = LASER_WAITING;
    freezeBackground = false;
    laserMissingFrames =
        LASER_RELEASE_FRAMES;
}

    //------------------------------------
    // Keep previously recorded hits visible
    //------------------------------------

currentLaserVisible = false;
    redrawOverlay();
    requestAnimationFrame(
        detectLaser
    );
    return;
}
    
    //---------------------------------------
    // Find centre
    //---------------------------------------

    const hitX=
        totalX/
        totalWeight;

    const hitY=
        totalY/
        totalWeight;

    //---------------------------------------
    // Laser is currently being tracked
    //---------------------------------------

laserMissingFrames = 0;

// Draw the live laser every frame
drawCurrentLaser(hitX, hitY);

//---------------------------------------
// STATE MACHINE -->
//---------------------------------------

if(laserState === LASER_WAITING){
    laserState = LASER_TRACKING;
    freezeBackground = true;
    laserMissingFrames = 0;

    const now = performance.now();

    if(now - lastShotTime >= DETECTOR.shotDelay){
        lastShotTime = now;
        shots++;

        console.log(
    "DETECT:",
    detectCanvas.width,
    detectCanvas.height,
    "OVERLAY:",
    overlay.width,
    overlay.height,
    "HIT:",
    hitX,
    hitY
);
        
      const savedX =
    hitX / detectCanvas.width;

const savedY =
    hitY / detectCanvas.height;


console.log(
    "SAVE HIT:",
    "RAW:",
    hitX,
    hitY,
    "NORMALIZED:",
    savedX,
    savedY,
    "LIVE PIXELS:",
    currentLaserX,
    currentLaserY
);


hits.push({
    x: savedX,
    y: savedY,
    time:
        (performance.now() - recordingStartTime) / 1000
});

        updateDisplays();
        playHitSound();

        console.log(
            "SHOT",
            shots,
            Math.round(hitX),
            Math.round(hitY)
        );
    }

}else{

    // Laser is already being tracked.
    // Do not record another shot.
    laserMissingFrames = 0;
}
    requestAnimationFrame(
        detectLaser
    );
}

//------------------------------------------------
// CALCULATE GROUP CENTER -->
//------------------------------------------------

function calculateGroupCenter(){

    //----------------------------------------
    // No shots recorded
    //----------------------------------------

    if(hits.length === 0){
        return null;
    }

    //----------------------------------------
    // Add all shot locations
    //----------------------------------------

    let totalX = 0;
    let totalY = 0;

    for(const hit of hits){
        totalX += hit.x;
        totalY += hit.y;
    }

    //----------------------------------------
    // Return average location
    //----------------------------------------

    return{
        x: totalX / hits.length,
        y: totalY / hits.length
    };
}

//------------------------------------------------
// REDRAW OVERLAY -->
//------------------------------------------------

function redrawOverlay({

    maxTime = Infinity
} = {}){

    //----------------------------------------
    // Clear everything
    //----------------------------------------

    clearOverlay();

//----------------------------------------
// Playback active target
//----------------------------------------

let savedActiveTarget = activeTarget;

if(maxTime !== Infinity){

    const playbackTarget =

        getPlaybackActiveTarget(

            maxTime

        );

    if(playbackTarget){

        activeTarget = playbackTarget;

    }

}
    
    //----------------------------------------
    // Draw all targets
    //----------------------------------------

drawGreenBoxes();

    //----------------------------------------
    // Draw recorded hits
    //----------------------------------------

drawHits(maxTime);

//----------------------------------------
// Restore live active target
//----------------------------------------

activeTarget = savedActiveTarget;
    
    //----------------------------------------
    // Draw countdown if active
    //----------------------------------------

    if(countdownValue !== null){
        ctx.save();
       ctx.font =
`bold ${overlay.width * .18}px Arial`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.lineWidth = 8;
        ctx.strokeStyle = "black";
        ctx.strokeText(
            countdownValue,
            overlay.width / 2,
            overlay.height / 2
        );

        ctx.fillStyle = "#FFD400";
        ctx.fillText(
            countdownValue,
            overlay.width / 2,
            overlay.height / 2
        );
        ctx.restore();
    }

    //----------------------------------------
    // Draw current laser
    //----------------------------------------

if(currentLaserVisible){
    ctx.beginPath();
   const laserRadius =
    overlay.width * .006;


ctx.arc(
    currentLaserX,
    currentLaserY,
    laserRadius,
    0,
    Math.PI * 2
);

ctx.strokeStyle = "red";
ctx.lineWidth =
Math.max(
2,
overlay.width * .002
);
    ctx.stroke();
}

    //----------------------------------------
    // Draw group center
    //----------------------------------------

if(
    analysisEnabled &&
    groupCenter &&
    playback.style.display != "none"
){
    const centerX =
        groupCenter.x * overlay.width;
    const centerY =
        groupCenter.y * overlay.height;
    ctx.strokeStyle = "red";
    ctx.lineWidth = 2;

    //----------------------------------------
    // Horizontal line
    //----------------------------------------

ctx.beginPath();
const crossSize =
overlay.width * .025;


ctx.moveTo(
centerX - crossSize,
centerY
);

ctx.lineTo(
centerX + crossSize,
centerY
);
ctx.stroke();

    //----------------------------------------
    // Vertical line
    //----------------------------------------

ctx.beginPath();
ctx.moveTo(
centerX,
centerY - crossSize
);

ctx.lineTo(
centerX,
centerY + crossSize
);
ctx.stroke();
    
    //----------------------------------------
    // White center dot
    //----------------------------------------

    ctx.beginPath();
    ctx.arc(
        centerX,
        centerY,
        crossSize * .25,
        0,
        Math.PI * 2
    );
    ctx.fillStyle = "white";
    ctx.fill();
    ctx.stroke();
}
}

    if(settingsPanel.style.display=="block"){
        settingsPanel.style.display="none";
    }

    else{
        settingsPanel.style.display="block";
    }
};


clearTargetBtn.onclick = () => {

    clearTargetData();

    settingsPanel.style.display = "none";
};


deleteTargetsBtn.onclick = ()=>{

    if(confirm("Delete ALL targets?")){
        deleteAllTargets();
        settingsPanel.style.display = "none";
    }

};

    
    

</script>

</body>

</html>
