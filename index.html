<script>
  // Handles clicking open and closing custom menu wrappers
  document.querySelectorAll('.custom-select-wrapper').forEach(wrapper => {
    const trigger = wrapper.querySelector('.select-trigger');
    const nativeSelect = wrapper.querySelector('select');
    
    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      // Close other dropdowns if open
      document.querySelectorAll('.custom-select-wrapper').forEach(w => {
        if(w !== wrapper) w.classList.remove('open');
      });
      wrapper.classList.toggle('open');
    });

    // Handle user selecting an explicit menu value choice option
    wrapper.querySelectorAll('.custom-option-item').forEach(item => {
      item.addEventListener('click', () => {
        const val = item.getAttribute('data-value');
        const text = item.textContent;
        
        // Sync custom UI text values
        trigger.textContent = text;
        
        // Update hidden native menu selector form values 
        nativeSelect.value = val;
        
        // Fire original .onchange event engine systems natively
        nativeSelect.dispatchEvent(new Event('change'));
        
        wrapper.classList.remove('open');
      });
    });
  });

  // Global click checker helper layer to close menus if user clicks elsewhere on page background canvas
  document.addEventListener('click', () => {
    document.querySelectorAll('.custom-select-wrapper').forEach(w => w.classList.remove('open'));
  });
</script>

//------------------------------------------------

//------------------------------------------------

function beginCalibrationDrag(e){

    if(calibrationStep !== 1){
        return;
    }
const rect = overlay.getBoundingClientRect();
    calibrationDragging = true;
    calibrationStartX =
        (e.clientX - rect.left) / rect.width;
    calibrationStartY =
        (e.clientY - rect.top) / rect.height;
    calibrationCurrentX = calibrationStartX;
    calibrationCurrentY = calibrationStartY;
    currentTarget.calibrated = false;
}

//------------------------------------------------
// UPDATE CALIBRATION DRAG -->
//------------------------------------------------

function updateCalibrationDrag(e){

    if(!calibrationDragging){
        return;
    }
const rect = overlay.getBoundingClientRect();
    calibrationCurrentX =
        (e.clientX - rect.left) / rect.width;
    calibrationCurrentY =
        (e.clientY - rect.top) / rect.height;
    currentTarget.left =
        Math.min(calibrationStartX, calibrationCurrentX);
    currentTarget.right =
        Math.max(calibrationStartX, calibrationCurrentX);
    currentTarget.top =
        Math.min(calibrationStartY, calibrationCurrentY);
    currentTarget.bottom =
        Math.max(calibrationStartY, calibrationCurrentY);
    redrawOverlay();
}

};
    calibrationStep = 1;

//------------------------------------------------
// COMPLETE DRAG CALIBRATION -->
//------------------------------------------------

function finishCalibrationDrag(e){

    if(!calibrationDragging){
        return;
    }
    calibrationDragging = false;
    if(calibrationStep===0){
        return;
    }
const rect = overlay.getBoundingClientRect();
    calibrationCurrentX =
        (e.clientX - rect.left) / rect.width;
    calibrationCurrentY =
        (e.clientY - rect.top) / rect.height;
    currentTarget.left =
        Math.min(calibrationStartX, calibrationCurrentX);
    currentTarget.right =
        Math.max(calibrationStartX, calibrationCurrentX);
    currentTarget.top =
        Math.min(calibrationStartY, calibrationCurrentY);
    currentTarget.bottom =
        Math.max(calibrationStartY, calibrationCurrentY);
currentTarget.calibrated = true;
currentTarget.shape = targetShape;

//----------------------------------------
// Every new target starts active
//----------------------------------------

currentTarget.active = true;

targets.push(currentTarget);

//----------------------------------------
// First target becomes active
//----------------------------------------

if(activeTarget === null){

    activeTarget = currentTarget;

}
calibrationStep = 0;
resizeEverything();
redrawOverlay();


console.log("Normalized Target:", currentTarget);
    alert("Calibration Complete");
}

function nextTarget(){

    //----------------------------------------
    // Build a list of usable targets
    //----------------------------------------

    const availableTargets =

        targets.filter(

            target => target.calibrated

        );

    if(availableTargets.length === 0){

        return;

    }

    //----------------------------------------
    // Only one target
    //----------------------------------------

    if(availableTargets.length === 1){

        activeTarget = availableTargets[0];

        redrawOverlay();

        return;

    }

    //----------------------------------------
    // Pick a different target
    //----------------------------------------

    let newTarget;

    do{

        const randomIndex = Math.floor(

            Math.random() *

            availableTargets.length

        );

        newTarget =

            availableTargets[randomIndex];

    }

    while(newTarget === activeTarget);

    //----------------------------------------
    // Activate it
    //----------------------------------------

    activeTarget = newTarget;

//----------------------------------------
// Save target change for playback
//----------------------------------------

targetHistory.push({

    id: activeTarget.id,

    time:
        (performance.now() - recordingStartTime) / 1000

});

redrawOverlay();

}

//------------------------------------------------
// GET ACTIVE TARGET FOR PLAYBACK
//------------------------------------------------

function getPlaybackActiveTarget(playbackTime){

    //----------------------------------------
    // Default to current active target
    //----------------------------------------

    let targetId = null;

    //----------------------------------------
    // Find latest target change
    //----------------------------------------

    for(const event of targetHistory){

        if(event.time <= playbackTime){

            targetId = event.id;

        }else{

            break;

        }

    }

    //----------------------------------------
    // Find matching target object
    //----------------------------------------

    if(targetId === null){
        return null;
    }

    return targets.find(

        target => target.id === targetId

    );

}

//------------------------------------------------
// SCAN ONE TARGET -->
//------------------------------------------------

function scanTarget(target, pixels){

    const box = getTargetPixels(target);

    let totalWeight = 0;
    let totalX = 0;
    let totalY = 0;

    let brightPixels = 0;

    //------------------------------------------------
    // Binary laser mask
    //------------------------------------------------

const laserMask = new Uint8Array(

    detectCanvas.width *

    detectCanvas.height

);

    //------------------------------------------------
    // Brightest laser pixel
    //------------------------------------------------

let brightestValue = -1;

let brightestX = 0;

let brightestY = 0;

    //------------------------------------------------
    // Reset grid brightness sums
    //------------------------------------------------

    let gridTotal = [];
    let gridCount = [];

    for(let gy=0; gy<GRID_ROWS; gy++){

        gridTotal[gy] = [];
        gridCount[gy] = [];

        for(let gx=0; gx<GRID_COLS; gx++){

            gridTotal[gy][gx] = 0;
            gridCount[gy][gx] = 0;

        }

    }

    //------------------------------------------------
    // Scan target
    //------------------------------------------------

    for(

        let y = Math.floor(box.top);

        y < Math.floor(box.bottom);

        y += DETECTOR.pixelStep

    ){

        const gridY = Math.max(

            0,

            Math.min(

                GRID_ROWS - 1,

                Math.floor(

                    ((y - box.top) * GRID_ROWS) /

                    (box.bottom - box.top)

                )

            )

        );

        for(

            let x = Math.floor(box.left);

            x < Math.floor(box.right);

            x += DETECTOR.pixelStep

        ){

            //----------------------------------------
            // Ignore pixels outside an oval target
            //----------------------------------------

            if(target.shape === "oval"){

                const centerX =
                    (box.left + box.right) / 2;

                const centerY =
                    (box.top + box.bottom) / 2;

                const radiusX =
                    (box.right - box.left) / 2;

                const radiusY =
                    (box.bottom - box.top) / 2;

                const dx =
                    (x - centerX) / radiusX;

                const dy =
                    (y - centerY) / radiusY;

                if((dx * dx + dy * dy) > 1){

                    continue;

                }

            }

            const i =

                (y * detectCanvas.width + x) * 4;

            const r = pixels[i];
            const g = pixels[i+1];
            const b = pixels[i+2];

            const brightness =

                (r + g + b) / 3;

            const gridX = Math.max(

                0,

                Math.min(

                    GRID_COLS - 1,

                    Math.floor(

                        ((x - box.left) * GRID_COLS) /

                        (box.right - box.left)

                    )

                )

            );

            gridTotal[gridY][gridX] += brightness;
            gridCount[gridY][gridX]++;

            const bgR = backgroundFrame[i];
            const bgG = backgroundFrame[i+1];
            const bgB = backgroundFrame[i+2];

            const redRise   = r - bgR;
            const greenRise = g - bgG;
            const blueRise  = b - bgB;

            const localBrightness =

                gridBrightness[gridY]?.[gridX] ?? 150;

            let localThreshold = DETECTOR.baseThreshold;

            if(localBrightness > 190){

                localThreshold += 6;

            }else if(localBrightness > 170){

                localThreshold += 3;

            }else if(localBrightness < 120){

                localThreshold -= 4;

            }

            const laser =

                redRise > localThreshold &&

                redRise >

                (greenRise + DETECTOR.colorDifference) &&

                redRise >

                (blueRise + DETECTOR.colorDifference);

            if(!laser){
                continue;
            }

    brightPixels++;

    laserMask[
    y * detectCanvas.width + x
    ] = 1;

    if(r > brightestValue){
    brightestValue = r;
    brightestX = x;
    brightestY = y;
}

    const weight =

    Math.max(
        brightness,
        r
    );

totalWeight += weight;

totalX += x * weight;

totalY += y * weight;

        }

    }

    //------------------------------------------------
    // Return scan results
    //------------------------------------------------

return{

    brightPixels,

    totalWeight,

    totalX,

    totalY,

    laserMask,

    brightestX,

    brightestY,

    brightestValue,

    gridTotal,

    gridCount

};
}

// SCAN ENTIRE FRAME

function scanEntireFrame(pixels){

    return scanTarget(
        {
            left:0,
            top:0,
            right:1,
            bottom:1,
            shape:"rectangle"
        },
        pixels
    );

}

//------------------------------------------------
// GROW CONNECTED LASER BLOB
//------------------------------------------------

function growLaserBlob(

    laserMask,

    startX,

    startY

){

    const width =
        detectCanvas.width;

    const height =
        detectCanvas.height;

    //----------------------------------------
    // Reject invalid seed
    //----------------------------------------

    if(

        startX < 0 ||

        startY < 0 ||

        startX >= width ||

        startY >= height

    ){

        return [];

    }

    if(

        !laserMask[
            startY * width + startX
        ]

    ){

        return [];

    }

    //----------------------------------------
    // Flood fill
    //----------------------------------------

    const stack = [];

    const blob = [];

    const visited =
        new Uint8Array(

            width * height

        );

    stack.push({

        x:startX,

        y:startY

    });

    while(stack.length){

        const p = stack.pop();

        const index =

            p.y * width + p.x;

        if(visited[index]){

            continue;

        }

        visited[index] = 1;

        if(!laserMask[index]){

            continue;

        }

        blob.push(p);

        //------------------------------------
        // 8-connected neighbours
        //------------------------------------

        for(

            let dy=-1;

            dy<=1;

            dy++

        ){

            for(

                let dx=-1;

                dx<=1;

                dx++

            ){

                if(

                    dx===0 &&

                    dy===0

                ){

                    continue;

                }

                const nx =

                    p.x + dx;

                const ny =

                    p.y + dy;

                if(

                    nx<0 ||

                    ny<0 ||

                    nx>=width ||

                    ny>=height

                ){

                    continue;

                }

                stack.push({

                    x:nx,

                    y:ny

                });

            }

        }

    }

    return blob;

}

//------------------------------------------------
// CALCULATE BLOB CENTER
//------------------------------------------------

function calculateBlobCenter(blob){

    if(blob.length === 0){

        return null;

    }

    let sumX = 0;
    let sumY = 0;

    for(const p of blob){

        sumX += p.x;
        sumY += p.y;

    }

    return{

        x: sumX / blob.length,

        y: sumY / blob.length

    };

}

//------------------------------------------------
// VALIDATE LASER BLOB
//------------------------------------------------

function validateBlob(

    blob,

    brightestValue

){

    //----------------------------------------
    // Reject empty blob
    //----------------------------------------

    if(blob.length === 0){

        return false;

    }

    //----------------------------------------
    // Reject blobs that are too small
    //----------------------------------------

    if(blob.length < 4){

        return false;

    }

    //----------------------------------------
    // Reject blobs that are too large
    //----------------------------------------

    if(blob.length > DETECTOR.maxBlobPixels){

        return false;

    }

    //----------------------------------------
    // Brightest pixel must be reasonably bright
    //----------------------------------------

    if(brightestValue < 150){

        return false;

    }

    return true;

}

//------------------------------------------------
// LASER DETECTION -->
//------------------------------------------------

function detectLaser(){

    if(
        !mediaRecorder ||
        mediaRecorder.state !== "recording"
    ){
        return;
    }


    //---------------------------------------
    // Copy current frame
    //---------------------------------------

    detectCtx.drawImage(
        preview,
        0,
        0,
        detectCanvas.width,
        detectCanvas.height
    );

    const frame = detectCtx.getImageData(
        0,
        0,
        detectCanvas.width,
        detectCanvas.height
    );

    const pixels = frame.data;

    //---------------------------------------
    // Learn background frame
    //---------------------------------------

if(learnBackground){
    backgroundFrame = new Uint8ClampedArray(pixels);
    learnBackground = false;
    console.log("Background learned");
    requestAnimationFrame(detectLaser);
    return;
}

if(!backgroundFrame){
    requestAnimationFrame(detectLaser);
    return;
}

//------------------------------------------------
// Scan entire frame if no targets exist.
// Otherwise scan only the active target.
//------------------------------------------------

let result = null;
let hitTarget = null;

const hasTarget = targets.some(
    target => target.calibrated
);

if(hasTarget){

    //----------------------------------------
    // Existing behavior
    //----------------------------------------

    if(
        activeTarget &&
        activeTarget.calibrated
    ){

        result = scanTarget(
            activeTarget,
            pixels
        );

        if(
            result.brightPixels >= DETECTOR.minBlobPixels &&
            result.brightPixels <= DETECTOR.maxBlobPixels
        ){
            hitTarget = activeTarget;
        }

    }

}else{

    //----------------------------------------
    // Treat the whole camera image as one target
    //----------------------------------------

    result = scanEntireFrame(pixels);

    if(
        result.brightPixels >= DETECTOR.minBlobPixels &&
        result.brightPixels <= DETECTOR.maxBlobPixels
    ){

        hitTarget = {

            id: "FULL_FRAME"

        };

    }

}
    
if(hitTarget){

    console.log(

        "Hit Target:",

        hitTarget.id

    );

    //----------------------------------------
    // Advance to the next target
    //----------------------------------------

    //----------------------------------------
    // Wait before calling next target
    //----------------------------------------

//----------------------------------------
// Schedule next target only once
//----------------------------------------

if(!waitingForNextTarget){

    waitingForNextTarget = true;

    setTimeout(

        ()=>{

            nextTarget();

            waitingForNextTarget = false;

        },

        250

    );

}

}

//------------------------------------------------
// Copy scan results
//------------------------------------------------

let brightPixels =
    result?.brightPixels ?? 0;
let totalWeight =
    result?.totalWeight ?? 0;
let totalX =
    result?.totalX ?? 0;
let totalY =
    result?.totalY ?? 0;

let laserMask =
    result?.laserMask ?? null;
    
let brightestX =
    result?.brightestX ?? 0;
let brightestY =
    result?.brightestY ?? 0;
let brightestValue =
    result?.brightestValue ?? 0;
    
let gridTotal =
    result?.gridTotal ?? [];
let gridCount =
    result?.gridCount ?? [];

    //------------------------------------------------
    // Update grid brightness map
    //------------------------------------------------

for(let gy=0; gy<GRID_ROWS; gy++){

    for(let gx=0; gx<GRID_COLS; gx++){
        if(gridCount[gy][gx] > 0){
            const average =
                gridTotal[gy][gx] /
                gridCount[gy][gx];
            gridBrightness[gy][gx] =
                average;
        }
    }
}
    
    //---------------------------------------
    // No Laser Detected
    //---------------------------------------

if(
    brightPixels < DETECTOR.minBlobPixels ||
    brightPixels > DETECTOR.maxBlobPixels
){
    laserMissingFrames++;

    //------------------------------------
    // Return to WAITING only after the
    // laser has been gone several frames.
    //------------------------------------

if(
    laserMissingFrames >=
    LASER_RELEASE_FRAMES
){

    laserState = LASER_WAITING;
    freezeBackground = false;
    laserMissingFrames =
        LASER_RELEASE_FRAMES;
}

    //------------------------------------
    // Keep previously recorded hits visible
    //------------------------------------

currentLaserVisible = false;
    redrawOverlay();
    requestAnimationFrame(
        detectLaser
    );
    return;
}
    
    //---------------------------------------
    // Find centre
    //---------------------------------------

//---------------------------------------
// Build connected laser blob
//---------------------------------------

const blob = growLaserBlob(

    laserMask,

    brightestX,

    brightestY

);

const blobCenter =

    calculateBlobCenter(blob);

const blobValid =

    validateBlob(

        blob,

        brightestValue

    );

    console.log(
    "Blob:",
    blob.length,
    "Brightest:",
    brightestValue,
    "Valid:",
    blobValid
);

//---------------------------------------
// Use blob center if valid
//---------------------------------------

const hitX =

    blobValid

        ? blobCenter.x

        : totalX / totalWeight;

const hitY =

    blobValid

        ? blobCenter.y

        : totalY / totalWeight;
    

    console.log(

    "BLOB SIZE:",

    blob.length

);

    //---------------------------------------
    // Laser is currently being tracked
    //---------------------------------------

laserMissingFrames = 0;

// Draw the live laser every frame
drawCurrentLaser(hitX, hitY);

//---------------------------------------
// STATE MACHINE -->
//---------------------------------------

if(laserState === LASER_WAITING){
    laserState = LASER_TRACKING;
    freezeBackground = true;
    laserMissingFrames = 0;

    const now = performance.now();

    if(now - lastShotTime >= DETECTOR.shotDelay){
        lastShotTime = now;
        shots++;

        console.log(
    "DETECT:",
    detectCanvas.width,
    detectCanvas.height,
    "OVERLAY:",
    overlay.width,
    overlay.height,
    "HIT:",
    hitX,
    hitY
);
        
    const savedX =
    detectorToNormX(hitX);

    const savedY =
    detectorToNormY(hitY);


console.log(
    "SAVE HIT:",
    "RAW:",
    hitX,
    hitY,
    "NORMALIZED:",
    savedX,
    savedY,
    "LIVE PIXELS:",
    currentLaserX,
    currentLaserY
);


hits.push({
    x: savedX,
    y: savedY,
    time:
        (performance.now() - recordingStartTime) / 1000
});

        updateDisplays();
        playHitSound();

        console.log(
            "SHOT",
            shots,
            Math.round(hitX),
            Math.round(hitY)
        );
    }

}else{

    // Laser is already being tracked.
    // Do not record another shot.
    laserMissingFrames = 0;
}
    requestAnimationFrame(
        detectLaser
    );
}

//------------------------------------------------
// DRAW HITS -->
//------------------------------------------------

function drawHits(maxTime = Infinity){

    if(hits.length > 0){

console.log(
    "DRAW HITS:",
    "overlay:",
    overlay.width,
    overlay.height,
    "hits:",
    hits.length
);

}

    //----------------------------------------
    // Draw every saved hit up to maxTime
    //----------------------------------------

   for(const hit of hits){

        if(hit.time > maxTime){
            continue;
        }

    const drawX =
    normToOverlayX(hit.x);

    const drawY =
    normToOverlayY(hit.y);


        ctx.beginPath();

       console.log(
    "DRAW MARKER:",
    drawX,
    drawY
);

       if(hit.time === hits[hits.length-1].time){

console.log(
    "DRAW MARKER:",
    drawX,
    drawY,
    "NORMALIZED:",
    hit.x,
    hit.y
);

} 
       
       ctx.arc(
            drawX,
            drawY,
            5,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "yellow";
        ctx.fill();

        ctx.lineWidth = 1;
        ctx.strokeStyle = "black";
        ctx.stroke();
    }
}
    
//------------------------------------------------
// CALCULATE GROUP CENTER -->
//------------------------------------------------

function calculateGroupCenter(){

    //----------------------------------------
    // No shots recorded
    //----------------------------------------

    if(hits.length === 0){
        return null;
    }

    //----------------------------------------
    // Add all shot locations
    //----------------------------------------

    let totalX = 0;
    let totalY = 0;

    for(const hit of hits){
        totalX += hit.x;
        totalY += hit.y;
    }

    //----------------------------------------
    // Return average location
    //----------------------------------------

    return{
        x: totalX / hits.length,
        y: totalY / hits.length
    };
}

//------------------------------------------------
// REDRAW OVERLAY -->
//------------------------------------------------

function redrawOverlay({

    maxTime = Infinity
} = {}){

    //----------------------------------------
    // Clear everything
    //----------------------------------------

    clearOverlay();

//----------------------------------------
// Playback active target
//----------------------------------------

let savedActiveTarget = activeTarget;

if(maxTime !== Infinity){

    const playbackTarget =

        getPlaybackActiveTarget(

            maxTime

        );

    if(playbackTarget){

        activeTarget = playbackTarget;

    }

}
    
    //----------------------------------------
    // Draw all targets
    //----------------------------------------

drawGreenBoxes();

    //----------------------------------------
    // Draw recorded hits
    //----------------------------------------

drawHits(maxTime);

//----------------------------------------
// Restore live active target
//----------------------------------------

activeTarget = savedActiveTarget;
    
    //----------------------------------------
    // Draw countdown if active
    //----------------------------------------

    if(countdownValue !== null){
        ctx.save();
       ctx.font =
`bold ${overlay.width * .18}px Arial`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.lineWidth = 8;
        ctx.strokeStyle = "black";
        ctx.strokeText(
            countdownValue,
            normToOverlayX(.5),
            normToOverlayY(.5)
        );

        ctx.fillStyle = "#FFD400";
        ctx.fillText(
            countdownValue,
            normToOverlayX(.5),
            normToOverlayY(.5)
        );
        
        ctx.restore();
    }

    //----------------------------------------
    // Draw current laser
    //----------------------------------------

if(currentLaserVisible){
    ctx.beginPath();
   const laserRadius =
    overlay.width * .006;


ctx.arc(
    normToOverlayX(currentLaserX),
    normToOverlayY(currentLaserY),
    8,
    0,
    Math.PI * 2
);

ctx.strokeStyle = "red";
ctx.lineWidth =
Math.max(
2,
overlay.width * .002
);
    ctx.stroke();
}

    //----------------------------------------
    // Draw group center
    //----------------------------------------

if(
    analysisEnabled &&
    groupCenter &&
    playback.style.display != "none"
){
    const centerX =
    normToOverlayX(groupCenter.x);

    const centerY =
    normToOverlayY(groupCenter.y);
    
    ctx.strokeStyle = "red";
    ctx.lineWidth = 2;

    //----------------------------------------
    // Horizontal line
    //----------------------------------------

ctx.beginPath();
const crossSize =
overlay.width * .025;


ctx.moveTo(
centerX - crossSize,
centerY
);

ctx.lineTo(
centerX + crossSize,
centerY
);
ctx.stroke();

    //----------------------------------------
    // Vertical line
    //----------------------------------------

ctx.beginPath();
ctx.moveTo(
centerX,
centerY - crossSize
);

ctx.lineTo(
centerX,
centerY + crossSize
);
ctx.stroke();
    
    //----------------------------------------
    // White center dot
    //----------------------------------------

    ctx.beginPath();
    ctx.arc(
        centerX,
        centerY,
        crossSize * .25,
        0,
        Math.PI * 2
    );
    ctx.fillStyle = "white";
    ctx.fill();
    ctx.stroke();
}
}


//------------------------------------------------
// UPDATE CURRENT LASER
//------------------------------------------------

function drawCurrentLaser(hitX, hitY){

    //----------------------------------------
    // Store normalized detector coordinates
    //----------------------------------------

    currentLaserX =
        hitX / detectCanvas.width;

    currentLaserY =
        hitY / detectCanvas.height;

    currentLaserVisible = true;
}

//------------------------------------------------
// LIVE OVERLAY LOOP -->
//------------------------------------------------

function liveOverlayLoop(){

    // Only run while viewing the live camera
    if(preview.style.display != "none"){
        redrawOverlay();
    }
    requestAnimationFrame(liveOverlayLoop);
}

function syncPlayback(){

if(
playback.paused ||
playback.ended
){
return;
}
redrawOverlay({
    maxTime: playback.currentTime
});

let t=
Math.floor(
playback.currentTime
);

let mins=
Math.floor(
t/60
)

.toString()
.padStart(
2,
"0"
);

let secs=
(t%60)
.toString()
.padStart(
2,
"0"
);

timerOverlay.innerHTML=
`${mins}:${secs}`;

requestAnimationFrame(
syncPlayback
);
}


//--------------------------
// ENTER RECORDING MODE
//--------------------------

function enterRecordingMode(){

    closeSettingsPanel();
    
    // Hide Start button
    startBtn.hidden = true;

    // Show Stop button
    stopBtn.hidden = false;

    // Hide setup controls
    setupControls.hidden = true;

    // Hide Drills button
    drillsBtn.hidden = true;

    // Close Settings popup
    settingsPanel.style.display = "none";

}

//--------------------------
// EXIT RECORDING MODE
//--------------------------

function exitRecordingMode(){

    // Show Start button
    startBtn.hidden = false;

    // Hide Stop button
    stopBtn.hidden = true;

    // Restore setup controls
    setupControls.hidden = false;

    // Restore Drills button
    drillsBtn.hidden = false;

    // Always leave Settings popup closed
    settingsPanel.style.display = "none";

}

//--------------------------
// SET APP MODE
//--------------------------

function setAppMode(mode){

    appMode = mode;

    switch(mode){

        case APP_SETUP:

            exitRecordingMode();

            break;

        case APP_COUNTDOWN:

            exitRecordingMode();

            break;

        case APP_RECORDING:

            enterRecordingMode();

            break;

        case APP_PLAYBACK:

            exitRecordingMode();

            break;

    }

}

// START BUTTON CLICK

console.log("START BUTTON CLICKED");

setAppMode(APP_RECORDING);

clearSessionData();

//--------------------------
// STOP BUTTON CLICK
//--------------------------

stopBtn.onclick = ()=>{

    console.log("STOP BUTTON CLICKED");


    // If countdown is running, cancel countdown only
    if(countdownRunning){

        clearInterval(countdownInterval);
        countdownInterval = null;
        countdownRunning = false;
        countdownValue = null;
        clearOverlay();
        drawHits();
        exitRecordingMode();
        console.log("COUNTDOWN CANCELLED");
        return;
    }


    // Otherwise stop active recording
    stopRecording();

};
